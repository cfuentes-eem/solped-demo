<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOLPED EEM · Plataforma</title>
<style>
  :root {
    --brand-dark: #252424;
    --brand-accent: #ff5757;
    --brand-accent-soft: rgba(255, 87, 87, 0.10);
    --brand-accent-strong: #e84a4a;
    --brand-gray: #cbcfcf;
    --grad-start: #ff5757;
    --grad-end: #a855f7;
    --p-blue: #3b82f6;       --p-blue-bg: #e0edff;
    --p-green: #22c55e;      --p-green-bg: #dcfce7;
    --p-orange: #f97316;     --p-orange-bg: #ffe6d4;
    --p-purple: #a855f7;     --p-purple-bg: #f3e8ff;
    --p-red: #ef4444;        --p-red-bg: #ffe1e1;
    --p-amber: #eab308;      --p-amber-bg: #fef3c7;
    --p-cyan: #06b6d4;       --p-cyan-bg: #cffafe;
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #252424;
    --muted: #6b7280;
    --border: #eef0f0;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 1px 3px rgba(37,36,36,0.06), 0 4px 12px rgba(37,36,36,0.04);
    --shadow-lg: 0 10px 40px rgba(37,36,36,0.15);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 16px 0; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .logo { display: flex; align-items: center; gap: 10px; padding: 4px 18px 16px; margin-bottom: 8px; }
  .logo-mark { width: 36px; height: 36px; border-radius: 8px; background: var(--brand-accent); color: white; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .logo-text { font-weight: 700; font-size: 15px; color: var(--brand-dark); }
  .nav-section-title { font-size: 10.5px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.6px; padding: 8px 22px 4px; }
  .nav { list-style: none; padding: 0 10px; margin: 0; }
  .nav li { margin-bottom: 2px; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #4b5563; text-decoration: none; font-size: 13.5px; border-radius: 10px; cursor: pointer; transition: background 0.12s ease, color 0.12s ease; position: relative; }
  .nav a:hover { background: #f5f5f5; color: var(--brand-dark); }
  .nav a.active { background: var(--brand-accent); color: white; font-weight: 600; }
  .nav .ico { width: 18px; height: 18px; flex-shrink: 0; font-size: 14px; display: inline-flex; justify-content: center; }
  .nav .pill { margin-left: auto; background: var(--p-red); color: white; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .nav a.active .pill { background: white; color: var(--brand-accent); }
  .sidebar-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; cursor: pointer; margin-top: auto; }

  /* Topbar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; background: white; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  .topbar-title { font-size: 14px; color: #4b5563; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .role-switch { display: flex; background: white; border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .role-pill { padding: 6px 12px; border-radius: 999px; font-size: 12.5px; color: #6b7280; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; user-select: none; }
  .role-pill.active { background: var(--brand-accent-soft); color: var(--brand-accent); font-weight: 600; border: 1px solid rgba(255,87,87,0.3); }
  .bell { width: 36px; height: 36px; border-radius: 50%; background: white; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: #4b5563; cursor: pointer; position: relative; }
  .bell-dot { position: absolute; top: 6px; right: 7px; width: 9px; height: 9px; background: var(--brand-accent); border-radius: 50%; border: 2px solid white; }
  .user { display: flex; align-items: center; gap: 10px; font-weight: 600; }

  /* Main */
  .main { background: var(--bg); }
  .content { padding: 24px 32px 60px; max-width: 1320px; }

  /* Hero */
  .hero { background: linear-gradient(95deg, var(--grad-start), var(--grad-end)); color: white; border-radius: var(--radius); padding: 22px 26px; margin-bottom: 22px; box-shadow: 0 8px 24px rgba(168, 85, 247, 0.12); }
  .hero-date { font-size: 13px; opacity: 0.95; }
  .hero-title { font-size: 26px; font-weight: 700; margin: 6px 0 4px; }
  .hero-sub { font-size: 14px; opacity: 0.95; }

  /* KPI */
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .kpi { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); }
  .kpi-text .lbl { font-size: 12.5px; color: #6b7280; margin-bottom: 6px; }
  .kpi-text .val { font-size: 26px; font-weight: 700; color: var(--brand-dark); line-height: 1; }
  .kpi-text .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .kpi-text .sub.down { color: var(--brand-accent); }
  .kpi-text .sub.up { color: var(--p-green); }
  .kpi-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .ico-blue   { background: var(--p-blue-bg);   color: var(--p-blue); }
  .ico-green  { background: var(--p-green-bg);  color: var(--p-green); }
  .ico-orange { background: var(--p-orange-bg); color: var(--p-orange); }
  .ico-purple { background: var(--p-purple-bg); color: var(--p-purple); }
  .ico-red    { background: var(--p-red-bg);    color: var(--p-red); }
  .ico-amber  { background: var(--p-amber-bg);  color: var(--p-amber); }
  .ico-cyan   { background: var(--p-cyan-bg);   color: var(--p-cyan); }

  /* Cards */
  .card { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .card-head h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--brand-dark); }

  table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.data th { background: #fafafa; text-align: left; padding: 12px 18px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; color: #6b7280; font-weight: 700; border-bottom: 1px solid var(--border); }
  table.data td { padding: 14px 18px; border-bottom: 1px solid var(--border); color: var(--text); }
  table.data tr:last-child td { border-bottom: none; }
  table.data tr:hover { background: #fafbfc; }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; color: var(--brand-dark); }

  /* Badges */
  .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .badge-pending  { background: var(--p-amber-bg);  color: #b45309; }
  .badge-approved { background: var(--p-blue-bg);   color: #1d4ed8; }
  .badge-paid     { background: var(--p-green-bg);  color: #15803d; }
  .badge-noboleta { background: var(--brand-accent-soft); color: var(--brand-accent); }
  .badge-acred    { background: #ede9fe; color: #6d28d9; }
  .badge-conc     { background: #e0e7ff; color: #3730a3; }
  .badge-rejected { background: #fce7e7; color: #991b1b; }
  .badge-type-solped { background: var(--p-blue-bg); color: var(--p-blue); }
  .badge-type-reembolso { background: var(--p-cyan-bg); color: #0e7490; }

  /* Buttons */
  .btn { border: none; border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.12s ease; text-decoration: none; }
  .btn-primary { background: var(--brand-accent); color: white; }
  .btn-primary:hover { background: var(--brand-accent-strong); }
  .btn-success { background: var(--p-green); color: white; }
  .btn-success:hover { background: #16a34a; }
  .btn-danger  { background: white; color: var(--p-red); border: 1px solid var(--p-red); }
  .btn-danger:hover { background: var(--p-red-bg); }
  .btn-ghost { background: white; border: 1px solid var(--border); color: var(--brand-dark); }
  .btn-ghost:hover { background: #f5f5f5; }
  .btn-link { background: none; color: var(--brand-accent); padding: 0; font-weight: 600; cursor: pointer; }
  .btn-big { padding: 12px 22px; font-size: 14.5px; }
  .btn-sm  { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
  .btn[disabled] { opacity: 0.4; cursor: not-allowed; }

  .pageHead { display:flex;justify-content:space-between;align-items:center;margin-bottom:18px; flex-wrap: wrap; gap: 12px; }
  .pageHead .crumb { font-size: 12px; color: var(--muted); }
  .pageHead h2 { margin: 4px 0 0; font-size: 22px; font-weight: 700; color: var(--brand-dark); }

  /* Tabs */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
  .tab { padding: 12px 18px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--brand-accent); border-bottom-color: var(--brand-accent); }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: span 2; }
  .form-group label { font-size: 12px; font-weight: 700; color: var(--brand-dark); text-transform: uppercase; letter-spacing: 0.4px; }
  .form-group input, .form-group select, .form-group textarea {
    padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: inherit; background: white; color: var(--text);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--brand-accent); box-shadow: 0 0 0 3px var(--brand-accent-soft); }
  .form-group .hint { font-size: 11.5px; color: var(--muted); }
  .form-group .err { font-size: 12px; color: var(--p-red); }

  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type-option { border: 2px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
  .type-option:hover { border-color: var(--brand-accent); }
  .type-option.selected { border-color: var(--brand-accent); background: var(--brand-accent-soft); }
  .type-option .t-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .type-option .t-title { font-weight: 700; color: var(--brand-dark); font-size: 14px; }
  .type-option .t-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .dropzone { border: 2px dashed #d1d5db; border-radius: 14px; padding: 30px 20px; text-align: center; background: #fafafa; cursor: pointer; transition: border-color .15s, background .15s; }
  .dropzone:hover { border-color: var(--brand-accent); background: var(--brand-accent-soft); }
  .dropzone.dragover { border-color: var(--brand-accent); background: var(--brand-accent-soft); }
  .dropzone-icon { font-size: 28px; color: var(--brand-accent); margin-bottom: 6px; }
  .dropzone-text { font-weight: 600; color: var(--brand-dark); }
  .dropzone-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Inbox grid */
  .inbox-grid { display: grid; grid-template-columns: 360px 1fr; gap: 16px; }
  .inbox-list { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; max-height: calc(100vh - 200px); overflow-y: auto; }
  .inbox-item { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s ease; }
  .inbox-item:last-child { border-bottom: none; }
  .inbox-item:hover { background: #fafbfc; }
  .inbox-item.active { background: var(--brand-accent-soft); border-left: 3px solid var(--brand-accent); padding-left: 13px; }
  .inbox-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .inbox-item-name { font-weight: 700; font-size: 13.5px; color: var(--brand-dark); }
  .inbox-item-time { font-size: 11px; color: var(--muted); }
  .inbox-item-detail { font-size: 12.5px; color: #4b5563; }
  .inbox-item-amount { font-weight: 700; color: var(--brand-dark); margin-top: 4px; font-size: 14px; }

  .inbox-detail { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .id-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .id-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin-bottom: 18px; }
  .id-meta { font-size: 12px; }
  .id-meta .lab { color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; font-size: 10.5px; font-weight: 700; }
  .id-meta .v { font-size: 14px; color: var(--brand-dark); font-weight: 600; margin-top: 2px; }
  .id-actions { display: flex; gap: 10px; padding-top: 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }

  /* Voucher zone */
  .voucher-zone { border: 2px dashed var(--brand-accent); border-radius: 14px; padding: 30px 20px; text-align: center; background: var(--brand-accent-soft); cursor: pointer; transition: background .15s; outline: none; }
  .voucher-zone:focus { background: rgba(255, 87, 87, 0.18); }
  .voucher-zone .vbig { font-size: 36px; color: var(--brand-accent); }
  .voucher-zone .vt { font-weight: 700; color: var(--brand-dark); font-size: 16px; margin: 6px 0 4px; }
  .voucher-zone .vh { font-size: 12.5px; color: var(--muted); }
  .kbd { display: inline-block; padding: 2px 8px; background: white; border: 1px solid var(--brand-gray); border-radius: 6px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; box-shadow: 0 1px 0 rgba(0,0,0,0.05); }
  .voucher-after { background: var(--p-green-bg); border-radius: 12px; padding: 16px; display: flex; gap: 14px; align-items: center; margin-top: 14px; }
  .voucher-after .check { width: 38px; height: 38px; border-radius: 50%; background: var(--p-green); color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }

  /* Timeline */
  .timeline { padding: 4px 0; }
  .tl-item { display: flex; gap: 14px; padding: 10px 0; position: relative; }
  .tl-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; background: var(--p-green-bg); color: var(--p-green); z-index: 1; }
  .tl-item.pending .tl-dot { background: #f3f4f6; color: #9ca3af; }
  .tl-item.current .tl-dot { background: var(--brand-accent); color: white; }
  .tl-item:not(:last-child)::after { content: ""; position: absolute; left: 15px; top: 42px; width: 2px; height: calc(100% - 32px); background: var(--border); }
  .tl-text { padding-top: 6px; }
  .tl-text strong { font-size: 13.5px; color: var(--brand-dark); }
  .tl-text .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .voucher-doc { background: #f8fafc; border: 1px dashed var(--brand-gray); border-radius: 8px; padding: 16px; margin-top: 12px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; color: var(--brand-dark); }
  .voucher-doc-head { text-align: center; font-weight: 700; margin-bottom: 8px; }
  .voucher-doc hr { border: none; border-top: 1px dashed var(--brand-gray); margin: 8px 0; }

  .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .filter-bar input, .filter-bar select { padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: white; }
  .right { margin-left: auto; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(37,36,36,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px); }
  .modal { background: white; border-radius: 14px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--brand-dark); }
  .modal-body { padding: 22px 24px; }
  .modal-foot { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); padding: 0; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--brand-dark); color: white; padding: 14px 20px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 13.5px; font-weight: 500; z-index: 200; display: flex; align-items: center; gap: 10px; animation: slideIn .25s ease; max-width: 360px; }
  .toast.success { background: var(--p-green); }
  .toast.error { background: var(--p-red); }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty-state .ico-empty { font-size: 50px; opacity: 0.4; margin-bottom: 12px; }

  /* Reset/dropdown */
  .dropdown { position: relative; }
  .dropdown-menu { position: absolute; top: 100%; right: 0; background: white; border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; min-width: 180px; z-index: 50; }
  .dropdown-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: 6px; }
  .dropdown-item:hover { background: #f5f5f5; }

  @media (max-width: 1080px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .inbox-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: relative; height: auto; }
    .form-grid { grid-template-columns: 1fr; }
    .role-switch { display: none; }
    .topbar { padding: 12px 18px; }
    .content { padding: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="app.js"></script>
</body>
</html>
